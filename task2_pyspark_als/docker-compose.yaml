services:
  jupyter_spark:
    image: quay.io/jupyter/pyspark-notebook:spark-3.5.3@sha256:6a4184ad094df225eedb1b6c7532fb9d294e9fa9f21fb4bcd5b2d9bbf0af0bd8
    container_name: task2_pyspark_als_container
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./work:/home/jovyan/work
      - ./execute_notebook.py:/home/jovyan/execute_notebook.py:ro
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=pyspark_ml
      - PYSPARK_SUBMIT_ARGS=--driver-memory 4g pyspark-shell
      - PYTHONPATH=/usr/local/spark/python:/usr/local/spark/python/lib/py4j-0.10.9.7-src.zip
      - OMP_NUM_THREADS=6
      - OPENBLAS_NUM_THREADS=6
      - MKL_NUM_THREADS=6
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/api?token=pyspark_ml', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
