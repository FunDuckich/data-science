services:
  jupyter_spark:
    image: quay.io/jupyter/pyspark-notebook:spark-3.5.3
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./work:/home/jovyan/work
    environment:
      - JUPYTER_TOKEN=pyspark_ml
      - PYSPARK_SUBMIT_ARGS=--driver-memory 2g pyspark-shell
      - PYTHONPATH=/usr/local/spark/python:/usr/local/spark/python/lib/py4j-0.10.9.7-src.zip
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
